name: astrbot_plugin_psyche_engine
display_name: 身心状态引擎
short_desc: 类脑生化与全身生理的双层状态模拟，按 ICD-11 诊断后约束模型表演
desc: >-
  为虚构角色维护一套可复算的精神与身体状态，每轮对话重新计算，并以最高优先级写入
  模型上下文。


  **精神层**：21 项神经化学、23 项神经电与环路、14 项人格特质、163 条 ICD-11 症状、
  72 个诊断原型、37 个病理预设。区分「正常 / 亚临床 / 病态」三档，健康基线不会被
  凭空误诊；调定点与症状地板使病态可维持，谈话治疗只能缓慢缓解；支持病程迟滞、
  治疗抵抗、药物延迟起效与反跳。内置 12 份完整量表（PHQ-9 / YMRS / PANSS / PCL-5 /
  SCL-90 等共 263 条），由角色自行填写并折回表演锚点。


  **身体层**：29 个器官、12 个系统、138 项检验、309 种疾病、204 种药物。角色自行
  吃饭、睡眠、运动、饮酒吸烟，遇环境变化、感染、外伤、慢性化与衰老；器官功能推导
  化验指标，疾病与药物叠加偏移，再由 eGFR、血气、阴离子间隙、LDL 等公式做自洽修正。
  身体与精神单向耦合（炎症、皮质醇、儿茶酚胺、5-HT、BDNF、睡眠压力、甲状腺素），
  身体的不适同样进入注入块。


  **声明**：本插件是角色扮演与创作辅助工具，不是医疗器械。诊断匹配、生化值、化验单
  均为面向叙事的简化模型，不构成医学意见，不可用于自我诊断或诊断他人。请仅用于虚构
  角色与明确知情的场景。
