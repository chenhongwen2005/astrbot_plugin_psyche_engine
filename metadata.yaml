name: astrbot_plugin_psyche_engine
display_name: 精神状态引擎 / 类脑生化模拟
short_desc: 量化类脑激素与脑电按 ICD-11 诊断，并模拟全身生理，以最高优先级约束模型表现
desc: >-
  为角色建立可量化的精神状态模型：21 项类脑神经化学指标、23 项神经电/环路指标、
  163 条 ICD-11 症状条目与 72 个 ICD-11 诊断原型。每轮对话根据用户话语做认知评估，
  更新激素与脑电状态，做贝叶斯式诊断匹配，并把「诊断 + 现状 + 表演要求」以最高优先级
  注入模型系统提示，使回复在语言、情绪、认知偏差上严格符合病理状态。


  **特性**：区分「正常 / 亚临床 / 病态」三档状态，健康基线不会被凭空误诊；调定点锚定
  使病态可维持、慢性负荷可把人拖入病态、谈话治疗只能缓慢减轻而极难痊愈；支持病程迟滞、
  治疗抵抗、药物延迟起效与反跳；内置 12 份完整量表（PHQ-9 / YMRS / PANSS / PCL-5 /
  SCL-90 等共 263 条），让角色自己填分并回灌为表演锚点。


  **v1.4 起附带全身生理模拟**：29 个器官 / 12 个系统 / 138 项检验 / 309 种疾病 /
  204 种药。角色会自己吃饭睡觉、运动受伤、遇上坏天气、感冒发烧、慢性化、变老；
  器官功能决定化验指标，疾病与药物叠加偏移，再用 eGFR、血气、阴离子间隙等公式做
  自洽修正。身体与精神单向耦合（炎症、皮质醇、甲状腺素、睡眠压力），身体的难受
  同样进入注入块，成为表演的一部分。


  **重要声明**：本插件是角色扮演与创作辅助工具，不是医疗器械。诊断匹配、生化与电生理
  数值均为面向叙事的简化模型，不构成任何医学意见，不可用于自我诊断或诊断他人。请仅在
  虚构角色、明确知情的场景中使用。
