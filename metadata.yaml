name: astrbot_plugin_psyche_engine
display_name: 身心状态引擎
short_desc: 类脑生化、全身生理、情感与记忆的分层状态模拟，按 ICD-11 诊断后约束模型表演
desc: >-
  为虚构角色维护一套可复算的精神与身体状态，每轮对话重新计算，并以最高优先级写入
  模型上下文。


  **精神层**：21 项神经化学、23 项神经电与环路、14 项人格特质、163 条 ICD-11 症状、
  72 个诊断原型、37 个病理预设。区分「正常 / 亚临床 / 病态」三档，健康基线不会被
  凭空误诊；调定点与症状地板使病态可维持，谈话治疗只能缓慢缓解；支持病程迟滞、
  治疗抵抗、药物延迟起效与反跳。内置 12 份完整量表（PHQ-9 / YMRS / PANSS / PCL-5 /
  SCL-90 等共 263 条），由角色自行填写并折回表演锚点。


  **身体层**：29 个器官、15 个系统、138 项检验、379 种疾病、204 种药物。角色自行
  吃饭、睡眠、运动、饮酒吸烟，遇环境变化、感染、外伤、慢性化与衰老；器官功能推导
  化验指标，疾病与药物叠加偏移，再由 eGFR、血气、阴离子间隙、LDL 等公式做自洽修正。

  完整的一天：会饿、会渴、会想上厕所；睡眠排成整夜结构（就寝点、入睡潜伏、深睡、
  REM、夜醒）；会切到手、崴到脚，伤口按日单调愈合；时钟走多久就老多久，老视与
  骨质疏松按年龄出现；喝酒有血浓度曲线与次日宿醉，咖啡因按残余量推迟入睡。

  个体不是模板：静息心率、体温、疼痛敏感度、免疫强弱、睡眠需求、早鸟或夜猫子，
  全部由 seed 决定且永不变。体温凌晨最低傍晚最高，血压睡着时降、清晨有晨峰。

  身心双向耦合：炎症、皮质醇、儿茶酚胺、5-HT、BDNF、睡眠压力、甲状腺素从身体
  写进精神；反过来，愤怒推心率与收缩压、恐惧让呼吸变浅、低落压低体温并抬高痛觉，
  按小时衰减。身体的不适与情绪的身体反应都进入注入块。


  **情感与记忆**：13 个情感分量各有半衰期，由生化底色（慢）与本轮刺激（快）合成，
  派生效价 / 唤醒 / 支配 / 强度，另有一条随负荷漂移的心境基线；情绪只以行为落点
  注入，不报数字。类脑记忆按强度衰减、睡眠巩固、低于阈值遗忘，检索用中文 2-gram
  与情绪一致性，注入时只带「这句话勾起了哪几件事、当时什么滋味」。


  **声明**：本插件是角色扮演与创作辅助工具，不是医疗器械。诊断匹配、生化值、化验单
  均为面向叙事的简化模型，不构成医学意见，不可用于自我诊断或诊断他人。请仅用于虚构
  角色与明确知情的场景。
